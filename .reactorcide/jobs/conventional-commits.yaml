name: catalystcal-conventional-commits
description: "Check that each pull request commit has a conventional commit subject"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  # Scripts run from the trusted CI checkout (/job/ci). They work on the
  # source checkout ($REACTORCIDE_CODE_DIR, default /job/src).
  command: "runnerlib run --job-command 'bash /job/ci/.reactorcide/jobs/scripts/conventional-commits.sh'"
  timeout: 300
  priority: 10
  working_dir: /job

