name: catalystcal-api-test
description: "gofmt, go vet, go test for api/ and coredb/, and a version-stamp check"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  # Scripts run from the trusted CI checkout (/job/ci). They work on the
  # source checkout ($REACTORCIDE_CODE_DIR, default /job/src).
  command: "runnerlib run --job-command 'bash /job/ci/.reactorcide/jobs/scripts/api-test.sh'"
  timeout: 1200
  priority: 10
  working_dir: /job

