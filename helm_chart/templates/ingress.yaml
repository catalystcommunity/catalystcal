{{- /* The Ingress alternative to the HTTPRoute. Same path split. */ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "catalystcal.fullname" . }}
  labels:
    {{- include "catalystcal.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- range list "/api" "/ics" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "catalystcal.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.api.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "catalystcal.fullname" $ }}-web
                port:
                  number: {{ $.Values.service.web.port }}
    {{- end }}
{{- end }}
