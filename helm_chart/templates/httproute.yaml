{{- /*
One HTTPRoute for the public hostname(s):
  /api  -> API   (CSIL-RPC, sign-in start, health)
  /ics  -> API   (public iCalendar feeds; calendar apps fetch these)
  /     -> web   (the SPA)
The longest matching path prefix wins, so /api and /ics go to the API.
*/ -}}
{{- $r := .Values.gateway.httpRoute -}}
{{- if $r.enabled }}
{{- if not $r.parentGateway }}
{{- fail "gateway.httpRoute.enabled is true: set gateway.httpRoute.parentGateway" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "catalystcal.fullname" . }}
  labels:
    {{- include "catalystcal.labels" . | nindent 4 }}
  {{- with $r.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $r.parentGateway }}
      {{- with $r.parentNamespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $r.parentSection }}
      sectionName: {{ . }}
      {{- end }}
  {{- with $r.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /ics
      backendRefs:
        - name: {{ include "catalystcal.fullname" . }}-api
          port: {{ .Values.service.api.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "catalystcal.fullname" . }}-web
          port: {{ .Values.service.web.port }}
{{- end }}
