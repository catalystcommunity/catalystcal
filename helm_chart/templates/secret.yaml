{{- if not .Values.secrets.existingSecret -}}
{{- /*
Keep a generated JWT secret across upgrades: read the live Secret first.
`lookup` returns nothing under `helm template`, so a new value is made there.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "catalystcal.fullname" .) -}}
{{- $jwt := .Values.secrets.jwtSecret -}}
{{- if not $jwt -}}
  {{- if and $existing $existing.data (index $existing.data "CATALYSTCAL_JWT_SECRET") -}}
    {{- $jwt = index $existing.data "CATALYSTCAL_JWT_SECRET" | b64dec -}}
  {{- else -}}
    {{- $jwt = randAlphaNum 64 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalystcal.fullname" . }}
  labels:
    {{- include "catalystcal.labels" . | nindent 4 }}
type: Opaque
stringData:
  CATALYSTCAL_JWT_SECRET: {{ $jwt | quote }}
  {{- with .Values.linkkeysRp.apiKey }}
  CATALYSTCAL_LINKKEYS_PKI_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.actAs.enabled (not .Values.actAs.existingSecret) }}
{{- if not .Values.actAs.appKeysJson }}
{{- fail "actAs.enabled is true: set actAs.existingSecret (recommended) or actAs.appKeysJson" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalystcal.actAsSecretName" . }}
  labels:
    {{- include "catalystcal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  {{ .Values.actAs.secretKey }}: {{ .Values.actAs.appKeysJson | quote }}
{{- end }}
